<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="currentColor">
  <!--
    Sitting cat silhouette — inspired by Wes's "Taxi the dog" theme wallpaper.
    Uses `currentColor` so the color can be set by the parent CSS.
  -->
  <g>
    <!-- Body (haunches + chest) -->
    <path d="M 62 170
             C 62 155, 55 140, 58 122
             C 61 108, 68 98, 80 92
             C 78 85, 79 75, 86 66
             C 82 52, 86 42, 96 40
             C 100 52, 99 60, 100 66
             L 122 66
             C 123 60, 122 52, 126 40
             C 136 42, 140 52, 136 66
             C 143 75, 144 85, 142 92
             C 154 98, 161 108, 164 122
             C 167 140, 160 155, 160 170
             L 162 176
             L 60 176 Z" />
    <!-- Tail curling up and around the right side -->
    <path d="M 160 162
             C 180 160, 188 148, 186 128
             C 180 138, 174 148, 168 156
             C 164 160, 162 161, 160 162 Z" />
    <!-- Eye highlights (negative space) -->
    <circle cx="98" cy="72" r="2" fill="#ffffff" opacity="0.25"/>
    <circle cx="124" cy="72" r="2" fill="#ffffff" opacity="0.25"/>
  </g>
</svg>
